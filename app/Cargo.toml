[package]
name = "canopy"
description = "A file explorer for Linux, drawn natively with svelte-gpui."
edition.workspace = true
version.workspace = true

[dependencies]
svelte_gpui_host = { path = "../../svelte-gpui/host" }
serde.workspace = true
serde_json.workspace = true
canopy-model.workspace = true
canopy-desktop.workspace = true
canopy-files.workspace = true
canopy-index.workspace = true

[features]
# Set by svelte-gpui's packager: runs the bundle packed into the binary.
package = []

[dev-dependencies]
tempfile = "3"
